[project]
name = "supraball-launcher"
version = "0.1.0"
description = "A Linux launcher for Supraball: host dedicated servers and browse internet servers"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[project.scripts]
supraball-launcher = "supraball_launcher.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
